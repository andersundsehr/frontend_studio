<html
  xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
  xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
  xmlns:frontend.studio="http://typo3.org/ns/Andersundsehr/FrontendStudio/Components"
  data-namespace-typo3-fluid="true"
>
<f:asset.script
  identifier="frontend-studio-component-tree-startup"
  src="EXT:frontend_studio/Resources/Public/JavaScript/Backend/component-tree-startup.js"
  type="module"
/>

<div
  class="frontend-studio-variant-view"
  data-frontend-studio-variant-view
  data-variant-identifier="{selectedVariantIdentifier}"
  data-preview-uri="{componentPreviewUri}"
  data-component-change-stream-uri="{componentChangeStreamUri}"
  data-component-file-path="{selectedComponentMetadata.template.relativePath}"
  data-component-fluid-tag-name="{selectedComponentMetadata.displayNamespace}:{selectedComponentMetadata.componentName}"
  data-selected-site-identifier="{selectedSiteIdentifier}"
  data-selected-language-hreflang="{selectedLanguageHreflang}"
  data-active-tab="{variantActiveTab}"
  data-sidebar-height="{variantSidebarHeight}"
  style="--frontend-studio-variant-sidebar-width: {variantSidebarWidth}px;
    {f:if(condition: '{variantSidebarHeight} !== {null}', then: '--frontend-studio-variant-sidebar-height: {variantSidebarHeight}px;')}"
>
  <div class="frontend-studio-variant-workspace">
    <div class="frontend-studio-variant-preview-column">
      <frontend.studio:variant.header
        selectedVariantIdentifier="{selectedVariantIdentifier}"
        selectedComponentMetadata="{selectedComponentMetadata}"
        componentPreviewUri="{componentPreviewUri}"
        previewSites="{previewSites}"
        previewLanguages="{previewLanguages}"
        selectedSiteIdentifier="{selectedSiteIdentifier}"
        selectedLanguageHreflang="{selectedLanguageHreflang}"
      />

      <div class="frontend-studio-variant-preview">
        <f:if condition="{componentPreviewUri}">
          <f:then>
            <iframe
              src="{componentPreviewUri}"
              title="Rendered component variant preview"
              data-frontend-studio-variant-frame
            ></iframe>
          </f:then>
          <f:else>
            <div class="p-4 text-body-secondary">
              The rendered component preview is not available.
            </div>
          </f:else>
        </f:if>
      </div>
    </div>

    <f:if condition="{selectedComponentMetadata.fixture.selectedVariant}">
      <frontend.studio:variant.sidebar
        selectedComponentMetadata="{selectedComponentMetadata}"
        variantActiveTab="{variantActiveTab}"
        renderedHtmlSource="{renderedHtmlSource}"
        renderedHtmlStatus="{renderedHtmlStatus}"
        fluidTemplateSource="{fluidTemplateSource}"
        fluidUsageSource="{fluidUsageSource}"
      />
    </f:if>
  </div>
</div>

</html>
