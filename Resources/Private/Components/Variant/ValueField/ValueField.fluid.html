<html
  xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
  xmlns:studio="http://typo3.org/ns/Andersundsehr/FrontendStudio/ViewHelpers"
  xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
  data-namespace-typo3-fluid="true"
>
<f:argument name="variantValue" type="Andersundsehr\FrontendStudio\Dto\ComponentVariantValueMetadata"/>
<f:asset.css identifier="frontend-studio-variant-view" href="EXT:frontend_studio/Resources/Public/Css/Backend/variant-view.css"/>

<f:if condition="{variantValue.description}">
  <f:then>
    <details class="frontend-studio-control-details" data-control-row>
      <summary class="frontend-studio-control-row frontend-studio-transformer-summary">
        <f:render section="Header" arguments="{variantValue: variantValue}"/>
      </summary>
      <p id="frontend-studio-value-description-{variantValue.fixtureName}" class="frontend-studio-control-description" data-control-description>{variantValue.description}</p>
    </details>
  </f:then>
  <f:else>
    <div class="frontend-studio-control-row" data-control-row>
      <f:render section="Header" arguments="{variantValue: variantValue}"/>
    </div>
  </f:else>
</f:if>

<f:section name="Header">
    <div class="frontend-studio-control-label">
      <strong>{variantValue.name}</strong>
      <f:if condition="{variantValue.required} == false"><span class="text-body-secondary">?</span></f:if>
      <f:if condition="{variantValue.shortType} != {variantValue.type}">
        <f:then>
          <span class="frontend-studio-control-type" data-control-type data-control-popover>
            <button type="button" class="frontend-studio-control-type-trigger" aria-describedby="frontend-studio-value-type-{variantValue.fixtureName}" aria-label="Full type for {variantValue.name}"><code>{variantValue.shortType}</code></button>
            <span id="frontend-studio-value-type-{variantValue.fixtureName}" class="frontend-studio-control-popover" role="tooltip" popover="auto"><code>{variantValue.type}</code></span>
          </span>
        </f:then>
        <f:else><code>{variantValue.shortType}</code></f:else>
      </f:if>
    </div>
    <div class="frontend-studio-control-input">
      <f:if condition="{variantValue.control}">
        <f:then>
          <f:asset.module identifier="{variantValue.control.module}"/>
          <div data-frontend-studio-control="{variantValue.control.module}" data-control-options="{variantValue.control.optionsJson}">
            <studio:control value="{variantValue}"/>
          </div>
        </f:then>
        <f:else>
      <f:if condition="{variantValue.options}">
        <f:then>
          <select
            id="frontend-studio-variant-value-{variantValue.fixtureName}"
            name="{variantValue.fixtureName}"
            aria-label="{variantValue.name}"
            data-frontend-studio-variant-value
            data-fixture-name="{variantValue.fixtureName}"
            data-fixture-type="{variantValue.type}"
            data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
            data-fixture-value-null="{f:if(condition: '{variantValue.nativeValue} === {null}', then: 'true', else: 'false')}"
            class="form-select"
            {f:if(condition: variantValue.required, then: 'required')}
          >
          <f:for each="{variantValue.options}" as="label" key="value">
            <option value="{value}" {f:if(condition:
            '{variantValue.value} == {value}', then: 'selected')}>{label}</option>
          </f:for>
          </select>
        </f:then>
        <f:else>
          <f:if condition="{variantValue.isDate}">
            <f:then>
              <input
                type="datetime-local"
                id="frontend-studio-variant-value-{variantValue.fixtureName}"
                name="{variantValue.fixtureName}"
                aria-label="{variantValue.name}"
                data-frontend-studio-variant-value
                data-fixture-name="{variantValue.fixtureName}"
                data-fixture-type="datetime"
                data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                data-fixture-value-null="{f:if(condition: '{variantValue.nativeValue} === {null}', then: 'true', else: 'false')}"
                class="form-control"
                {f:if(condition: variantValue.required, then: 'required')}
                value="{variantValue.value}"
              />
            </f:then>
            <f:else>
              <f:switch expression="{variantValue.type}">
                <f:case value="bool">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      id="frontend-studio-variant-value-{variantValue.fixtureName}"
                      name="{variantValue.fixtureName}"
                      aria-label="{variantValue.name}"
                      data-frontend-studio-variant-value
                      data-fixture-name="{variantValue.fixtureName}"
                      data-fixture-type="{variantValue.type}"
                      data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                      class="form-check-input"
                      value="1"
                      {f:if(condition: '{variantValue.value} == \'true\'', then: 'checked')}
                    />
                  </div>
                </f:case>
                <f:case value="boolean">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      id="frontend-studio-variant-value-{variantValue.fixtureName}"
                      name="{variantValue.fixtureName}"
                      aria-label="{variantValue.name}"
                      data-frontend-studio-variant-value
                      data-fixture-name="{variantValue.fixtureName}"
                      data-fixture-type="{variantValue.type}"
                      data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                      class="form-check-input"
                      value="1"
                      {f:if(condition: '{variantValue.value} == \'true\'', then: 'checked')}
                    />
                  </div>
                </f:case>
                <f:case value="int">
                  <input
                    type="number"
                    step="1"
                    id="frontend-studio-variant-value-{variantValue.fixtureName}"
                    name="{variantValue.fixtureName}"
                    aria-label="{variantValue.name}"
                    data-frontend-studio-variant-value
                    data-fixture-name="{variantValue.fixtureName}"
                    data-fixture-type="{variantValue.type}"
                    data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                    data-fixture-value-null="{f:if(condition: '{variantValue.nativeValue} === {null}', then: 'true', else: 'false')}"
                    class="form-control"
                    {f:if(condition: variantValue.required, then: 'required')}
                    value="{variantValue.value}"
                    />
                </f:case>
                <f:case value="integer">
                  <input
                    type="number"
                    step="1"
                    id="frontend-studio-variant-value-{variantValue.fixtureName}"
                    name="{variantValue.fixtureName}"
                    aria-label="{variantValue.name}"
                    data-frontend-studio-variant-value
                    data-fixture-name="{variantValue.fixtureName}"
                    data-fixture-type="{variantValue.type}"
                    data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                    data-fixture-value-null="{f:if(condition: '{variantValue.nativeValue} === {null}', then: 'true', else: 'false')}"
                    class="form-control"
                    {f:if(condition: variantValue.required, then: 'required')}
                    value="{variantValue.value}"
                    />
                </f:case>
                <f:case value="float">
                  <input
                    type="number"
                    step="any"
                    id="frontend-studio-variant-value-{variantValue.fixtureName}"
                    name="{variantValue.fixtureName}"
                    aria-label="{variantValue.name}"
                    data-frontend-studio-variant-value
                    data-fixture-name="{variantValue.fixtureName}"
                    data-fixture-type="{variantValue.type}"
                    data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                    data-fixture-value-null="{f:if(condition: '{variantValue.nativeValue} === {null}', then: 'true', else: 'false')}"
                    class="form-control"
                    {f:if(condition: variantValue.required, then: 'required')}
                    value="{variantValue.value}"
                    />
                </f:case>
                <f:case value="double">
                  <input
                    type="number"
                    step="any"
                    id="frontend-studio-variant-value-{variantValue.fixtureName}"
                    name="{variantValue.fixtureName}"
                    aria-label="{variantValue.name}"
                    data-frontend-studio-variant-value
                    data-fixture-name="{variantValue.fixtureName}"
                    data-fixture-type="{variantValue.type}"
                    data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                    data-fixture-value-null="{f:if(condition: '{variantValue.nativeValue} === {null}', then: 'true', else: 'false')}"
                    class="form-control"
                    {f:if(condition: variantValue.required, then: 'required')}
                    value="{variantValue.value}"
                    />
                </f:case>
                <f:case value="string">
                  <f:if condition="{variantValue.isMultiline}">
                    <f:then>
                      <textarea
                        id="frontend-studio-variant-value-{variantValue.fixtureName}"
                        name="{variantValue.fixtureName}"
                        aria-label="{variantValue.name}"
                        data-frontend-studio-variant-value
                        data-fixture-name="{variantValue.fixtureName}"
                        data-fixture-type="{variantValue.type}"
                        data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                        data-fixture-value-null="{f:if(condition: '{variantValue.nativeValue} === {null}', then: 'true', else: 'false')}"
                        class="form-control"
                        {f:if(condition: variantValue.required, then: 'required')}
                        rows="3"
                      >{variantValue.value}</textarea>
                    </f:then>
                    <f:else>
                      <input
                        type="text"
                        id="frontend-studio-variant-value-{variantValue.fixtureName}"
                        name="{variantValue.fixtureName}"
                        aria-label="{variantValue.name}"
                        data-frontend-studio-variant-value
                        data-fixture-name="{variantValue.fixtureName}"
                        data-fixture-type="{variantValue.type}"
                        data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                        data-fixture-value-null="{f:if(condition: '{variantValue.nativeValue} === {null}', then: 'true', else: 'false')}"
                        class="form-control"
                        {f:if(condition: variantValue.required, then: 'required')}
                        value="{variantValue.value}"
                        />
                    </f:else>
                  </f:if>
                </f:case>
                <f:case value="null">
                  <input
                    type="text"
                    id="frontend-studio-variant-value-{variantValue.fixtureName}"
                    name="{variantValue.fixtureName}"
                    aria-label="{variantValue.name}"
                    data-frontend-studio-variant-value
                    data-fixture-name="{variantValue.fixtureName}"
                    data-fixture-type="{variantValue.type}"
                    data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                    data-fixture-value-null="{f:if(condition: '{variantValue.nativeValue} === {null}', then: 'true', else: 'false')}"
                    class="form-control"
                    {f:if(condition: variantValue.required, then: 'required')}
                    value=""
                    />
                </f:case>
                <f:defaultCase>
                  <textarea
                    id="frontend-studio-variant-value-{variantValue.fixtureName}"
                    name="{variantValue.fixtureName}"
                    aria-label="{variantValue.name}"
                    data-frontend-studio-variant-value
                    data-fixture-name="{variantValue.fixtureName}"
                    data-fixture-type="{variantValue.type}"
                    data-fixture-value-defined="{f:if(condition: variantValue.isFixtureValue, then: 'true', else: 'false')}"
                    data-fixture-value-null="{f:if(condition: '{variantValue.nativeValue} === {null}', then: 'true', else: 'false')}"
                    class="form-control"
                    {f:if(condition: variantValue.required, then: 'required')}
                    rows="3"
                    >{variantValue.value}</textarea>
                </f:defaultCase>
              </f:switch>
            </f:else>
          </f:if>
        </f:else>
      </f:if>
        </f:else>
      </f:if>
    </div>
</f:section>
</html>
