<html
  xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
  xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
  data-namespace-typo3-fluid="true"
>
<f:argument name="data" type="array"/>
<f:argument name="disabled" type="bool" default="true"/>
<f:form.button type="button" class="btn btn-primary btn-sm" data="{data}" disabled="{disabled}">
  <core:icon identifier="actions-save"/>
  Save
</f:form.button>
</html>
