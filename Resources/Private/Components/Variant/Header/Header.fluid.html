<html
  xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
  xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
  data-namespace-typo3-fluid="true"
>
<f:argument name="selectedVariantIdentifier" type="string"/>
<f:argument name="selectedComponentMetadata" type="Andersundsehr\FrontendStudio\Dto\ComponentMetadata" optional="{true}"/>
<f:argument name="componentPreviewUri" type="string" optional="{true}"/>
<f:argument name="previewSites" type="array"/>
<f:argument name="previewLanguages" type="array"/>
<f:argument name="selectedSiteIdentifier" type="string"/>
<f:argument name="selectedLanguageHreflang" type="string"/>
<f:asset.css identifier="frontend-studio-variant-view" href="EXT:frontend_studio/Resources/Public/Css/Backend/variant-view.css"/>
<f:asset.script identifier="frontend-studio-variant-view" src="EXT:frontend_studio/Resources/Public/JavaScript/Backend/variant-view.js" type="module"/>

<div class="frontend-studio-variant-header">
  <f:if condition="{selectedVariantIdentifier}">
    <f:then>
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="min-w-0 d-flex flex-wrap align-items-center gap-1">
          <typo3-backend-content-navigation-toggle
            class="btn btn-sm btn-icon btn-default btn-borderless"
            action="expand"
            hidden
          ></typo3-backend-content-navigation-toggle>

          <h1 class="h6 mb-0">
            <f:if condition="{selectedComponentMetadata.variantLabel}">
              <f:then>{selectedComponentMetadata.variantLabel}</f:then>
              <f:else>Selected component variant</f:else>
            </f:if>
          </h1>
          <div class="small text-body-secondary text-truncate">
            <code>{selectedVariantIdentifier}</code>
          </div>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-2">
          <f:if condition="{previewSites}">
            <div class="d-flex flex-wrap align-items-center gap-2" role="group" aria-label="Preview context">
              <select
                class="form-select form-select-sm"
                aria-label="Site"
                data-frontend-studio-site-select
              >
                <f:for each="{previewSites}" as="site">
                  <option value="{site.identifier}" data-languages="{site.languagesJson}" {f:if(condition: '{site.identifier} == {selectedSiteIdentifier}', then: 'selected')}>{site.title}</option>
                </f:for>
              </select>
              <f:if condition="{previewLanguages}">
                <select
                  class="form-select form-select-sm"
                  aria-label="Language"
                  data-frontend-studio-language-select
                >
                  <f:for each="{previewLanguages}" as="language">
                    <option value="{language.value}" {f:if(condition: '{language.value} == {selectedLanguageHreflang}', then: 'selected')}>{language.title}</option>
                  </f:for>
                </select>
              </f:if>
            </div>
          </f:if>
          <f:if condition="{selectedComponentMetadata.template.relativePath}">
            <button
              type="button"
              class="btn btn-default btn-sm"
              title="Copy component file path"
              data-frontend-studio-copy-component-path
            >
              Copy file path
              <core:icon identifier="actions-edit-copy" size="small"/>
            </button>
          </f:if>
          <f:if condition="{componentPreviewUri}">
            <a
              href="{componentPreviewUri}"
              target="_blank"
              rel="noopener noreferrer"
              class="btn btn-default btn-sm"
              data-frontend-studio-open-rendered-variant
            >
              Open rendered variant
              <core:icon identifier="actions-window-open" size="small"/>
            </a>
          </f:if>
        </div>
      </div>

      <f:if condition="{selectedComponentMetadata.errors}">
        <div class="alert alert-warning mt-2 mb-0">
          <ul class="mb-0">
            <f:for each="{selectedComponentMetadata.errors}" as="error">
              <li>{error}</li>
            </f:for>
          </ul>
        </div>
      </f:if>
    </f:then>
    <f:else>
      <h1 class="h4 mb-1">No component variant selected</h1>
      <p class="mb-0 text-body-secondary">Select a component variant from the tree to render it.</p>
    </f:else>
  </f:if>
</div>
</html>
