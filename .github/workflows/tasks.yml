name: Tasks

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "0 2 * * 1-5"

jobs:
  lint-php:
    name: "php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        typo3: [ '14' ]
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/checkout@v6
      # CI-only alias until TYPO3 accepts the security-fixed svg-sanitize ^1.0.
      - run: composer require "enshrined/svg-sanitize:1.0.0 as 0.22.99" --dev --no-update --sort-packages --no-interaction
      - run: composer update --with typo3/cms-core:^${{ matrix.typo3 }}
      - run: ./vendor/bin/grumphp run --ansi

  unit-tests:
    name: "unit php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        typo3: [ '14' ]
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/checkout@v6
      # CI-only alias until TYPO3 accepts the security-fixed svg-sanitize ^1.0.
      - run: composer require "enshrined/svg-sanitize:1.0.0 as 0.22.99" --dev --no-update --sort-packages --no-interaction
      - run: composer update --with typo3/cms-core:^${{ matrix.typo3 }}
      - run: CI=true ./Build/Scripts/runTests.sh -p ${{ matrix.php }} -s unit

  functional-tests:
    name: "functional database: ${{ matrix.database }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [ 'mysql', 'mariadb', 'postgres' ]
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - uses: actions/checkout@v6
      # CI-only alias until TYPO3 accepts the security-fixed svg-sanitize ^1.0.
      - run: composer require "enshrined/svg-sanitize:1.0.0 as 0.22.99" --dev --no-update --sort-packages --no-interaction
      - run: composer update --with typo3/cms-core:^14
      - run: CI=true ./Build/Scripts/runTests.sh -b docker -p 8.5 -s functional -d ${{ matrix.database }}

  unit-tests-js:
    name: "JavaScript and TypeScript (Playwright and Tests/browser)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: CI=true ./Build/Scripts/runTests.sh -b docker -s javascript

  javascript-build-check:
    name: "JavaScript bundle reproducibility"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: CI=true ./Build/Scripts/runTests.sh -b docker -s javascriptBuildCheck
