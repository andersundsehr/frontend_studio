name: Tasks

on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"
  schedule:
    - cron: "0 2 * * 1-5"

jobs:
  lint-php:
    name: "php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        typo3: [ '14' ]
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/checkout@v6
      - run: composer update --with typo3/cms-core:^${{ matrix.typo3 }}
      - run: ./vendor/bin/grumphp run --ansi

  unit-tests:
    name: "unit php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5' ]
        typo3: [ '14' ]
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/checkout@v6
      - run: composer update --with typo3/cms-core:^${{ matrix.typo3 }}
      - run: CI=true ./Build/Scripts/runTests.sh -p ${{ matrix.php }} -s unit

  functional-tests:
    name: "functional database: ${{ matrix.database }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [ 'mysql', 'mariadb', 'postgres' ]
    steps:
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - uses: actions/checkout@v6
      - run: composer update --with typo3/cms-core:^14
      - run: CI=true ./Build/Scripts/runTests.sh -p 8.5 -s functional -d ${{ matrix.database }}

  unit-tests-js:
    name: "unit js"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm init --yes
      - run: npm install --no-save --no-package-lock vitest@5.0.1
      - run: npx vitest run Tests/Playwright/getUrlForVariant.node.test.ts
