[global]
daemonize = no
pid = /tmp/issue29-fpm.pid
error_log = /proc/self/fd/2

[probe]
listen = 0.0.0.0:9000
user = www-data
group = www-data
pm = static
pm.max_children = 2
catch_workers_output = yes
php_admin_value[output_buffering] = 4096

pm.status_path = /status.php
pm.status_listen = 0.0.0.0:9001
access.log = /proc/self/fd/2
access.format = "%p %r %{milliseconds}dms"
